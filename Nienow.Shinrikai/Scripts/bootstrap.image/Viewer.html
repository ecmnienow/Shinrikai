<div style="display: block; text-align: center;" class="modal fade in" id="image-gallery" tabindex="-1" role="dialog" aria-labelledby="myModalLabel" aria-hidden="false">
    <div class="modal-dialog" style="display: inline-block; width: auto;">
        <div class="modal-content">
            <div class="modal-header" style="text-align: left;">
                <button type="button" class="close" data-dismiss="modal" onclick="$('#image-gallery').remove()">
                    <span aria-hidden="true">×</span><span class="sr-only">Close</span>
                </button>
                <h4 class="modal-title" id="image-gallery-title">Imagem</h4>
            </div>
            <div class="modal-body" style="padding: 15px 15px;">
                <img id="image-gallery-image" class="img-responsive center-block" style="max-height: 500px;" />
            </div>
            <div class="modal-footer bottom-right">
                <button type="button" id="show-next-image" class="btn btn-default" onclick="$('#image-gallery').remove()">Fechar</button>
            </div>
        </div>
    </div>
</div>

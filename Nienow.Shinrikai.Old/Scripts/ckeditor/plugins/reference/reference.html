<!-- Modal -->
<div id="referenceDialog" class="modal" role="dialog">
    <div class="modal-dialog modal-sm">
        <!-- Modal content-->
        <div class="modal-content">
            <div class="modal-header">
                <button type="button" class="close" onclick="$('#referenceDialog').remove()">&times;</button>
                <h4 class="modal-title">Inserir referência</h4>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label for="txtReference" class="control-label">Referência</label>
                    <input id="txtReference" type="text" class="form-control" />
                    <input id="txtReferenceID" type="hidden" />
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-default" onclick="addReference($('#txtReferenceID').val());">OK</button>
                <button type="button" class="btn btn-default" onclick="$('#referenceDialog').remove();">Cancelar</button>
            </div>
        </div>
    </div>
</div>

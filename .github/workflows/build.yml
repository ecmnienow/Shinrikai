name: Build
on:
  push:
    branches:
      - master
  pull_request:

jobs:
  build:
    name: Build
    runs-on: windows-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}  # Needed to get PR information, if any
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Shallow clones should be disabled for a better relevancy of analysis

      - name: Set up .NET (versão do global.json)
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Nienow.Shinrikai.Web/ClientApp/package-lock.json

      - name: Set up JDK 17 (SonarQube scanner)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Cache SonarQube packages
        uses: actions/cache@v4
        with:
          path: ~\sonar\cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Cache SonarQube scanner
        id: cache-sonar-scanner
        uses: actions/cache@v4
        with:
          path: .\.sonar\scanner
          key: ${{ runner.os }}-sonar-scanner
          restore-keys: ${{ runner.os }}-sonar-scanner

      - name: Install SonarQube scanner
        if: steps.cache-sonar-scanner.outputs.cache-hit != 'true'
        shell: powershell
        run: |
          New-Item -Path .\.sonar\scanner -ItemType Directory
          dotnet tool update dotnet-sonarscanner --tool-path .\.sonar\scanner

      # A análise do SonarQube depende de um servidor externo: se ele estiver fora do ar (ou os
      # secrets não existirem), o build e os testes continuam valendo e só a análise é pulada.
      # Um comando por step: o PowerShell só devolve o código de saída do último comando.
      - name: SonarQube begin
        id: sonar-begin
        if: env.SONAR_TOKEN != ''
        continue-on-error: true
        shell: powershell
        run: .\.sonar\scanner\dotnet-sonarscanner begin /k:"${{ secrets.SONAR_PROJECT_KEY }}" /d:sonar.token="${{ secrets.SONAR_TOKEN }}" /d:sonar.host.url="${{ secrets.SONAR_HOST_URL }}"

      - name: Build
        run: dotnet build Nienow.Shinrikai.sln -c Release

      - name: Test
        run: dotnet test Nienow.Shinrikai.sln -c Release --no-build

      - name: SonarQube end
        if: steps.sonar-begin.outcome == 'success'
        continue-on-error: true
        shell: powershell
        run: .\.sonar\scanner\dotnet-sonarscanner end /d:sonar.token="${{ secrets.SONAR_TOKEN }}"

      - name: Install web dependencies
        run: npm --prefix Nienow.Shinrikai.Web/ClientApp ci

      - name: Build web
        run: npm --prefix Nienow.Shinrikai.Web/ClientApp run build

  # Monta as imagens dos containers (sem publicar em registry) e valida o compose.yaml.
  docker:
    name: Docker images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate compose.yaml
        run: cp .env.example .env && docker compose config --quiet

      - name: Build API image
        run: docker build -f Nienow.Shinrikai.Api/Dockerfile -t shinrikai-api:${{ github.sha }} .

      - name: Build Web image
        run: docker build -f Nienow.Shinrikai.Web/Dockerfile -t shinrikai-web:${{ github.sha }} .
